[project]
name = "deteccion-letras-senas"
version = "0.1.0"
description = "Captura de dataset y deteccion de letras de lenguaje de senas (LSE) con MediaPipe y LSTM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=1.0.0",
    "mlflow>=2.12",
    "numpy",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "black>=24.10",
    "pre-commit>=4.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["utils", "scripts"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["utils", "scripts", "training"]
